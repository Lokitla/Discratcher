name: Fork CI

# Fast verification for the fusion branches. Mirrors ci.yml's checks, but
# runs on Ubuntu so it starts quickly, and it also runs on demand.
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'p0/**'
      - 'p1/**'

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: disc-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test -p disc-core --release

  web:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  app:
    name: discratcher check (tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo check -p discratcher
