name: Fork Build

# Compiles the application on GitHub runners and keeps the installers as
# workflow artifacts. Use this instead of building locally: the Windows SDK and
# the MSVC linker are not installed on the development machine, so a local
# cargo build always fails at link time.
#
# Run it from the Actions tab, or with:
#   gh workflow run "Fork Build" -R Lokitla/Discratcher --ref feat/fusion-p0-p1
#   gh run watch <run-id> -R Lokitla/Discratcher --exit-status
#
# This workflow never publishes a release and needs no signing secrets, because
# it does not apply src-tauri/tauri.updater.conf.json. Pushing a v* tag still
# goes through release.yml, which signs the updater artifacts.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile: release, or debug for a faster build"
        required: false
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: ""
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: ""
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tauri CLI runs build.beforeBuildCommand (pnpm build) by itself.
      # There is no --release flag: release is the default, --debug opts out.
      - name: Build the application
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.profile }}" = "debug" ]; then
            args+=(-d)
          fi
          if [ -n "${{ matrix.target }}" ]; then
            args+=(-t "${{ matrix.target }}")
          fi
          pnpm tauri build ${args[@]+"${args[@]}"}

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: discratcher-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: warn
          retention-days: 14
